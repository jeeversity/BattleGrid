<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleGrid | Free Fire Esports</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#080808;
    color:#fff;
}

/* ================= NAVBAR ================= */

.navbar{
    height:68px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0b0b0b;
    border-bottom:1px solid #252525;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.logo span{
    color:#ff542f;
}

.back{
    text-decoration:none;
    color:#999;
    font-size:14px;
}

.back:hover{
    color:white;
}


/* ================= MAIN ================= */

.container{
    width:90%;
    max-width:1150px;
    margin:auto;
}


/* ================= HERO ================= */

.hero{
    height:310px;
    margin-top:25px;
    border-radius:16px;
    overflow:hidden;
    position:relative;

    background:
    linear-gradient(90deg,
    rgba(0,0,0,.94),
    rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1500&q=80");

    background-size:cover;
    background-position:center;

    border:1px solid #292929;
}

.hero-content{
    position:absolute;
    left:32px;
    bottom:30px;
}

.badge{
    display:inline-block;
    background:#ff542f;
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:12px;
}

.hero h1{
    font-size:39px;
    margin-bottom:8px;
}

.hero p{
    color:#bbb;
    font-size:15px;
}


/* ================= QUICK INFO ================= */

.quick-info{

    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:16px;
}

.info{
    background:#101010;
    border:1px solid #292929;
    border-radius:11px;
    padding:17px;
}
