<!DOCTYPE html>
<html lang="en">
    <head>
            <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Register | BattleGrid</title>
                        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <div class="auth-page">
                <div class="auth-box register-box">

                            <div class="auth-logo">
                                            BATTLE<span>GRID</span>
                            </div>

                                    <h1>Create Account</h1>

                                            <p class="auth-subtitle">
                                                            Join the BattleGrid arena.
                                            </p>

                                                    <form id="registerForm"><label for="name">Full Name</label>
                                                            <input
                                                                    type="text"
                                                                            id="name"
                                                                                    placeholder="Enter your name"
                                                                                            required
                                                                                                >
                                                                                            
                                                                                                    <label for="registerEmail">Email Address</label>
                                                                                                        <input
                                                                                                                type="email"
                                                                                                                        id="registerEmail"
                                                                                                                                placeholder="Enter your email"
                                                                                                                                        required
                                                                                                                                            >
                                                                                                                                        
                                                                                                                                                <label for="registerPassword">Password</label>
                                                                                                                                                    <input
                                                                                                                                                            type="password"
                                                                                                                                                                    id="registerPassword"
                                                                                                                                                                            placeholder="Create a password"
                                                                                                                                                                                    minlength="6"
                                                                                                                                                                                            required
                                                                                                                                                                                                >
                                                                                                                                                                                            
                                                                                                                                                                                                    <label for="game">Select Game</label>
                                                                                                                                                                                                        <select id="game" required>
                                                                                                                                                                                                                        <option value="">Choose your game</option>
                                                                                                                                                                                                                                    <option value="freefire">Free Fire</option>
                                                                                                                                                                                                                                                <option value="pubg">PUBG</option>
                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                <div id="freeFireFields" class="game-fields">

                                                                                                                                                                                                                                <label for="freeFireUid">Free Fire UID</label>
                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                            type="text"
                                                                                                                                                                                                                                                                            id="freeFireUid"
                                                                                                                                                                                                                                                                                            placeholder="Enter your Free Fire UID"
                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                    <label for="freeFireLevel">
                                                                                                                                                                                                                                                                                                                                        Free Fire Account Level
                                                                                                                                                                                                                                                                                                                    </label>

                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                                                id="freeFireLevel"
                                                                                                                                                                                                                                                                                                                                                                                placeholder="Minimum Level 30"
                                                                                                                                                                                                                                                                                                                                                                                                min="30"
                                                                                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                                                                                        <p class="eligibility-note">
                                                                                                                                                                                                                                                                                                                                                                                                                                            ⭐ Free Fire tournament eligibility:
                                                                                                                                                                                                                                                                                                                                                                                                                                                            Account Level 30+
                                                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="mode">Tournament Mode</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <select id="mode">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="">Choose mode</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="solo">Solo</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="duo">Duo</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="squad">Squad</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="pubgFields" class="game-fields">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="pubgUid">PUBG UID</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                id="pubgUid"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Enter your PUBG UID"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label class="terms-check">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            type="checkbox"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            id="terms"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        I agree to the
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a href="#">Terms & Conditions</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        and
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a href="#">Privacy Policy</a>.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </span>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit" class="auth-btn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        CREATE ACCOUNT →
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                        </form></form>

                                                                                                                                                                                                                <div class="divider">OR</div>

                                                                                                                                                                                                                        <p class="create-account">
                                                                                                                                                                                                                                        Already have an account?
                                                                                                                                                                                                                                                    <a href="login.html">Login</a>
                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                <a href="index.html" class="back-home">
                                                                                                                                                                                                                                                ← Back to BattleGrid
                                                                                                                                                                                                                                </a>

                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                            const gameSelect = document.getElementById("game");

                                                                                                                                                                                                                            const freeFireFields = document.getElementById("freeFireFields");
                                                                                                                                                                                                                            const pubgFields = document.getElementById("pubgFields");

                                                                                                                                                                                                                            gameSelect.addEventListener("change", function () {

                                                                                                                                                                                                                                    freeFireFields.style.display = "none";
                                                                                                                                                                                                                                        pubgFields.style.display = "none";

                                                                                                                                                                                                                                            if (this.value === "freefire") {
                                                                                                                                                                                                                                                        freeFireFields.style.display = "block";
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                if (this.value === "pubg") {
                                                                                                                                                                                                                                                            pubgFields.style.display = "block";
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                            const registerForm = document.getElementById("registerForm");

                                                                                                                                                                                                                                            registerForm.addEventListener("submit", function(event) {

                                                                                                                                                                                                                                                    event.preventDefault();

                                                                                                                                                                                                                                                        if (gameSelect.value === "freefire") {

                                                                                                                                                                                                                                                                    const level =
                                                                                                                                                                                                                                                                                Number(document.getElementById("freeFireLevel").value);

                                                                                                                                                                                                                                                                                        if (level < 30) {
                                                                                                                                                                                                                                                                                                        alert("Free Fire account level must be 30 or above.");
                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                        alert("Account created successfully!");

                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                        </html>
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                            })
                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                            })
