<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleGrid - Free Fire</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090909;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

/* NAVBAR */

.navbar {
    height: 65px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0d0d;
    border-bottom: 1px solid #252525;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #ff552f;
}

.back {
    color: #999;
    font-size: 14px;
}

/* MAIN */

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

/* BANNER */

.banner {
    height: 300px;
    margin-top: 25px;
    border-radius: 15px;
    border: 1px solid #292929;

    display: flex;
    align-items: flex-end;
    padding: 30px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.95),
            rgba(0,0,0,0.35)
        ),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200");

    background-size: cover;
    background-position: center;
}

.banner-content span {
    background: #ff552f;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.banner h1 {
    margin-top: 14px;
    font-size: 38px;
}

.banner p {
    margin-top: 7px;
    color: #bbb;
}

/* INFO */

.info {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 15px;
}

.info-box {
    background: #111111;
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 17px;
}

.info-box small {
    color: #777;
    display: block;
    font-size: 11px;
    margin-bottom: 7px;
}

.info-box strong {
    font-size: 15px;
}

/* SECTION */

.section {
    margin-top: 38px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 5px;
}

.section-subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 18px;
}

/* MATCH SECTION */

.mode-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.mode-header h2 {
    font-size: 22px;
}

.mode-header p {
    color: #777;
    font-size: 12px;
}

/* MATCHES */

.matches {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.match {
    background: #111111;
    border: 1px solid #292929;
    border-radius: 11px;
    padding: 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.match:hover {
    border-color: #ff552f;
}

.match-number {
    color: #ff6545;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 6px;
}

.match-time {
    font-size: 18px;
    font-weight: bold;
}

.match-slots {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.match-right {
    text-align: right;
}

.open {
    color: #5fd37b;
    font-size: 11px;
    margin-bottom: 8px;
}
